<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速公路即時影像監控系統</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 100%;
            margin: 0 auto 12px auto;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            white-space: nowrap;
        }

        select {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 修改為 2 欄網格 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            flex: 1;
            align-content: start;
        }

        .cam-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
            width: 100%;
        }

        .cam-card.is-empty {
            background-color: transparent;
            border: 1px dashed var(--border-color);
            box-shadow: none;
        }

        .cam-card.is-offline {
            /* border-color: var(--danger-color); */
			border-color: var(--border-color); /* 保持原本的深灰藍邊框 */
        }

        .video-container {
            position: relative;
            width: 100%;
			background-color: #000000;
			aspect-ratio: 352 / 240; /* 預設 16:9 占位，等影像載入後自動更正 */
			padding-top: 0; /* 移除原本硬性固定的 padding-top */			
        }

        .video-container img.source-img {
            display: none;
        }

        .video-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: filter 0.3s ease;
        }

        .video-container canvas.offline {
            filter: brightness(0.9);
        }

        .cam-info {
            padding: 10px 12px;
            background-color: var(--card-bg);
        }

        .cam-title {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            line-height: 1.4;
        }

        .cam-link {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.2s, text-decoration 0.2s;
        }

        .cam-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .badge {
            background-color: var(--accent-color);
            color: #000000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: nowrap;
            margin-left: 8px;
            margin-top: 4px;
        }

        .badge.badge-offline {
            background-color: var(--danger-color);
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        .float-btn {
            position: fixed;
            z-index: 999;
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.85rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            display: none;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .float-btn:hover {
            transform: translateY(-3px);
            background-color: #7dd3fc;
        }

        #btnPrev { top: 15px; right: 20px; }
        #btnNext { bottom: 15px; right: 20px; }
    </style>
</head>

					EMPTY126: {},
					"CCTV-N5-N-54.300-I": {"VideoStreamURL": "https://cctvn5.freeway.gov.tw/abs2mjpg/bmjpg?camera=96f4f648-e7e6-422e-b320-3d043a2e4694","link": "https://www.twipcam.com/cam/n5-n-54k-300","RoadName": "國道5號","RoadDirection": "北上","RoadSection": "---蘇澳","location": "54K+300 北"},
				},
			},
            "N3": {
                "N3-0-30": {
                    "CCTV-N3-N-10.000-M": { "CCTVID": "CCTV-N3-N-10.000-M", "VideoStreamURL": "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=18600","link": "https://www.twipcam.com/cam/n1-s-51k-380", "RoadName": "國道3號", "RoadDirection": "北上", "RoadSection": "基金-汐止", "location": "國道3號 北上 10.0K" }
                }
            }
        };

        const selectRoad = document.getElementById('selectRoad');
        const selectRange = document.getElementById('selectRange');
        const videoGrid = document.getElementById('videoGrid');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');

        function initRoadSelect() {
            Object.keys(cctvData).forEach(roadKey => {
                const opt = document.createElement('option');
                opt.value = roadKey;
                opt.textContent = roadKey;
                selectRoad.appendChild(opt);
            });
            initIntersectionObserver();
            initAutoRefreshLoop();
        }

        function initIntersectionObserver() {
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        visibleCards.add(entry.target);
                    } else {
                        visibleCards.delete(entry.target);
                    }
                });
            }, {
                root: null,
                threshold: 0.1
            });
        }

        function initAutoRefreshLoop() {
            if (autoCheckInterval) clearInterval(autoCheckInterval);
            
            autoCheckInterval = setInterval(() => {
                visibleCards.forEach(card => {
                    if (card.dataset.isOffline === "true") {
                        if (card.refreshStream) {
                            card.refreshStream();
                        }
                    }
                });
            }, 1000);
        }

        selectRoad.addEventListener('change', function() {
            const selectedRoad = this.value;
            selectRange.innerHTML = '<option value="">-- 請選擇區間 --</option>';
            clearAllVideos();

            if (!selectedRoad || !cctvData[selectedRoad]) {
                selectRange.disabled = true;
                updateFloatButtons();
                return;
            }

            const rangesObj = cctvData[selectedRoad];
            Object.keys(rangesObj).forEach(rangeKey => {
                const camMap = rangesObj[rangeKey];
                const count = Object.values(camMap).filter(cam => cam && cam.VideoStreamURL).length;

                const opt = document.createElement('option');
                opt.value = rangeKey;
                opt.textContent = `${rangeKey} (${count})`;
                selectRange.appendChild(opt);
            });

            selectRange.disabled = false;
            updateFloatButtons();
        });

        selectRange.addEventListener('change', function() {
            const selectedRoad = selectRoad.value;
            const selectedRange = this.value;

            clearAllVideos();

            if (!selectedRoad || !selectedRange) {
                updateFloatButtons();
                return;
            }

            const camMap = cctvData[selectedRoad][selectedRange];
            if (camMap) {
                renderVideos(Object.values(camMap));
            }

            updateFloatButtons();
        });

        function clearAllVideos() {
            activeTimers.forEach(id => {
                cancelAnimationFrame(id);
                clearInterval(id);
            });
            activeTimers = [];
			
			// 2. 清除 DOM 中的圖片與 Canvas 引用，防止背景持續載入
			const oldImgs = videoGrid.querySelectorAll('img');
			oldImgs.forEach(img => {
				img.onload = null;
				img.onerror = null;
				img.src = ""; // 切斷網路請求
			});
				
            if (observer) {
                observer.disconnect();
            }
            visibleCards.clear();
            videoGrid.innerHTML = '';
        }

        function updateFloatButtons() {
            const idx = selectRange.selectedIndex;
            const total = selectRange.options.length;

            if (idx <= 0) {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
                return;
            }

            if (idx > 1) {
                const prevText = selectRange.options[idx - 1].text;
                btnPrev.innerHTML = `▲ 上一區間 ${prevText}`;
                btnPrev.style.display = 'flex';
            } else {
                btnPrev.style.display = 'none';
            }

            if (idx < total - 1) {
                const nextText = selectRange.options[idx + 1].text;
                btnNext.innerHTML = `▼ 下一區間 ${nextText}`;
                btnNext.style.display = 'flex';
            } else {
                btnNext.style.display = 'none';
            }
        }

        btnPrev.addEventListener('click', function() {
            if (selectRange.selectedIndex > 1) {
                selectRange.selectedIndex -= 1;
                selectRange.dispatchEvent(new Event('change'));
				
				// 使用 setTimeout 確保 DOM 渲染新畫面的卡片後再執行滾動
				setTimeout(() => {
					window.scrollTo({ 
						top: document.documentElement.scrollHeight, 
						behavior: 'smooth' 
					});
				}, 50);
			}
        });

        btnNext.addEventListener('click', function() {
            if (selectRange.selectedIndex < selectRange.options.length - 1) {
                selectRange.selectedIndex += 1;
                selectRange.dispatchEvent(new Event('change'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        // 簡化後的 renderVideos 函數，不再產生流水號卡片
        function renderVideos(cams) {
            cams.forEach((cam, index) => {
                createCamCard(cam, index);
            });
        }

        function createCamCard(cam, index) {
            const card = document.createElement('div');
            card.id = `cam-card-${index}`;

            if (!cam || !cam.VideoStreamURL) {
                card.className = 'cam-card is-empty';
                videoGrid.appendChild(card);
                return;
            }

            card.className = 'cam-card';
            const canvasId = `cam-canvas-${index}`;
            const imgId = `cam-img-${index}`;
            const badgeId = `cam-badge-${index}`;

            card.dataset.imgId = imgId;
            card.dataset.isOffline = "false";
            card.dataset.baseUrl = cam.VideoStreamURL;
            card.dataset.direction = cam.RoadDirection || '即時';

            const imgUrl = `${cam.VideoStreamURL}&t=${Date.now()}&r=${Math.random()}`;

            const sectionText = cam.RoadSection ? cam.RoadSection.replace('-', ' - ') : '';
            const locationTitle = cam.location || `${cam.RoadName} ${cam.RoadDirection}`;

            card.innerHTML = `
                <div class="video-container">
                    <img id="${imgId}" class="source-img" src="${imgUrl}" alt="${locationTitle}">
                    <canvas id="${canvasId}"></canvas>
                </div>
                <div class="cam-info">
                    <div class="cam-title">
                        <a href="${cam.link || '#'}" target="_blank" rel="noopener noreferrer" class="cam-link">
                            ${locationTitle}<br>${sectionText}
                        </a>
                        <span id="${badgeId}" class="badge">${cam.RoadDirection || '即時'}</span>
                    </div>
                </div>
            `;

            videoGrid.appendChild(card);
            if (observer) {
                observer.observe(card);
            }
            startStreamCanvasMirror(imgId, canvasId, badgeId, card);
        }

        function startStreamCanvasMirror(imgId, canvasId, badgeId, card) {
            const img = document.getElementById(imgId);
            const canvas = document.getElementById(canvasId);
            const badge = document.getElementById(badgeId);
            if (!img || !canvas || !badge) return;

            const ctx = canvas.getContext('2d');
            let animTimer = null;
            let checkTimer = null;
            let isBroken = false;
            let lastUpdate = Date.now();
            let isRefreshing = false;

            function triggerOffline() {
                if (isBroken) return;
                isBroken = true;

                if (animTimer) cancelAnimationFrame(animTimer);

                canvas.classList.add('offline');
                badge.textContent = '斷訊';
                badge.classList.add('badge-offline');

                if (card) {
                    card.classList.add('is-offline');
                    card.dataset.isOffline = "true";
                }
            }

            function drawFrame() {
                if (isBroken|| !document.body.contains(canvas)) return;

                if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                    if (canvas.width !== img.naturalWidth) {
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                    }
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    lastUpdate = Date.now();
                }

                animTimer = requestAnimationFrame(drawFrame);
            }

            function restoreOnline() {
                isBroken = false;
                canvas.classList.remove('offline');
                badge.textContent = card ? card.dataset.direction : '即時';
                badge.classList.remove('badge-offline');

                if (card) {
                    card.classList.remove('is-offline');
                    card.dataset.isOffline = "false";
                }

                drawFrame();
            }

            img.onload = function() {
                if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                    if (isBroken) {
                        restoreOnline();
                    }
                    if (canvas.width !== img.naturalWidth) {
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                    }
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    lastUpdate = Date.now();
                }
            };

            img.onerror = function() {
                triggerOffline();
            };

            card.refreshStream = function() {
                if (isRefreshing) return;
                isRefreshing = true;

                const tempImg = new Image();
                const freshUrl = `${card.dataset.baseUrl}&t=${Date.now()}&r=${Math.random()}`;

                tempImg.onload = function() {
                    if (tempImg.naturalWidth > 0 && tempImg.naturalHeight > 0) {
                        img.src = "";
                        img.src = freshUrl;

                        if (canvas.width !== tempImg.naturalWidth) {
                            canvas.width = tempImg.naturalWidth;
                            canvas.height = tempImg.naturalHeight;
                        }
                        ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
                        lastUpdate = Date.now();

                        if (isBroken) {
                            restoreOnline();
                        }
                    }
                    isRefreshing = false;
                };

                tempImg.onerror = function() {
                    isRefreshing = false;
                    tempImg.src = "";
                };

                tempImg.src = freshUrl;
            };

            drawFrame();

            checkTimer = setInterval(() => {
				if (!document.body.contains(canvas)) {
					clearInterval(checkTimer);
					if (animTimer) cancelAnimationFrame(animTimer);
					return;
				}			
                if (Date.now() - lastUpdate > 1500) {
                    triggerOffline();
                }
            }, 500);
            activeTimers.push(checkTimer);
        }

        initRoadSelect();
    </script>

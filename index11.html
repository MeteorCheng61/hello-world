			cursor: pointer;

			z-index: 2;

			color: white;

			transform: scale(1.08);
		}
		.floating-gps-btn:active {

	function initSelectors() {
		roadSelect.innerHTML = '';
		const roadKeys = Object.keys(All_Data);

		const isSingleRoad = roadKeys.length === 1;
		const isSingleSegment = isSingleRoad && Object.keys(All_Data[roadKeys[0]]).length === 1;

		if (isSingleRoad && isSingleSegment) {
			selectorContainer.style.display = 'none';

			const defaultOpt = document.createElement('option');
			defaultOpt.value = '';
			defaultOpt.textContent = '-- 請選擇道路 --';
			roadSelect.appendChild(defaultOpt);

		roadKeys.forEach(road => {
			const opt = document.createElement('option');
			opt.value = road;
			opt.textContent = road;
			roadSelect.appendChild(opt);
		});

		roadSelect.addEventListener('change', onRoadChange);
		segmentSelect.addEventListener('change', onSegmentChange);

		if (roadKeys.length === 1) {
			roadSelect.value = roadKeys[0];
		}

		onRoadChange();

		if (Def_Road && Def_Section && All_Data[Def_Road] && All_Data[Def_Road][Def_Section]) {
			roadSelect.value = Def_Road;

	function onRoadChange() {
		const selectedRoad = roadSelect.value;
		segmentSelect.innerHTML = '';

		if (!selectedRoad || !All_Data[selectedRoad]) {
			const defaultOpt = document.createElement('option');
			defaultOpt.value = '';
			defaultOpt.textContent = '-- 請先選擇道路 --';
			segmentSelect.appendChild(defaultOpt);
			onSegmentChange();
			return;
		}

		const segmentKeys = Object.keys(All_Data[selectedRoad]);

		if (segmentKeys.length > 1) {
			const defaultOpt = document.createElement('option');
			defaultOpt.value = '';
			defaultOpt.textContent = '-- 請選擇區劃 --';
			segmentSelect.appendChild(defaultOpt);
		}

		segmentKeys.forEach(segment => {
			const opt = document.createElement('option');
			opt.value = segment;
			// 計算該區段中 title 為非空值的數量
			const validTitleCount = All_Data[selectedRoad][segment].filter(
				item => item.title && item.title.trim() !== ''
			).length;

			// 於選單文字加上數量標籤
			opt.textContent = `${segment} (${validTitleCount})`;
			segmentSelect.appendChild(opt);
		});

		if (segmentKeys.length === 1) {
			segmentSelect.value = segmentKeys[0];
		}

		onSegmentChange();
	}

	function clearCCTVData() {
		activeTimers.forEach(timer => {
			clearInterval(timer);
			clearTimeout(timer);
		});
		activeTimers = [];
		cameraControllers.length = 0;
		if (observer) observer.disconnect(); // 避免舊節點洩漏
		container.innerHTML = '<div class="empty-prompt">請選擇道路與區劃以載入即時影像</div>';

	// 啟動或重設 ScrollingTimeout 倒數機制
	function triggerScrollingTimeout() {
		// 每次滑動均重設為 10
		ScrollingTimeout = 10;

		// 若尚未啟動每秒計時器，則啟動
		if (!scrollingInterval) {
			scrollingInterval = setInterval(() => {
				if (ScrollingTimeout > 0) {
					ScrollingTimeout--;
				} else {
					ScrollingTimeout = 0;
					clearInterval(scrollingInterval);
					scrollingInterval = null;
				}
			}, 1000);
		}
	}

	function onSegmentChange() {
		const selectedRoad = roadSelect.value;
		const selectedSegment = segmentSelect.value;

		if (!selectedRoad || !selectedSegment || !All_Data[selectedRoad] || !All_Data[selectedRoad][selectedSegment]) {
			document.getElementById('pageTitle').innerText = `🛣️ 國道即時影像`;
			cctvData = [];
			clearCCTVData();
			return;
		}

		document.getElementById('pageTitle').innerText = `🛣️ ${selectedRoad} (${selectedSegment}) 即時影像`;
		cctvData = All_Data[selectedRoad][selectedSegment];
		loadCCTVData();
	}

	function loadCCTVData() {
		activeTimers.forEach(timer => clearInterval(timer));
		activeTimers = [];
		cameraControllers.length = 0;
		container.innerHTML = '';

		cctvData.forEach((item, index) => {
			const box = document.createElement('div');
			box.className = 'cctv-box';
			box.setAttribute('data-index', index);
			
			if (!item.title && !item.src) {
				box.style.visibility = 'hidden';
				container.appendChild(box);
				return;
			}
			
			box.setAttribute('data-in-view', 'false');

			const titleDiv = document.createElement('div');
			titleDiv.className = 'cctv-title';
			titleDiv.innerHTML = formatTitle(item.title);

			titleDiv.addEventListener('click', function() {
				if(item.link) window.open(item.link, '_blank');
			});
			
			const wrapper = document.createElement('div');
			wrapper.className = 'video-wrapper';

			const img = document.createElement('img');
			img.className = 'cctv-img';
			img.src = item.src;

			const canvas = document.createElement('canvas');
			canvas.className = 'cctv-canvas';
			const ctx = canvas.getContext('2d');

			wrapper.appendChild(img);
			wrapper.appendChild(canvas);
			box.appendChild(titleDiv);
			box.appendChild(wrapper);
			container.appendChild(box);

			observer.observe(box);

			let lastUpdate = Date.now();
			let isFrozen = false;
			let retryCount = 0;
			let consecutiveFailures = 0;

			img.onload = function() {
				lastUpdate = Date.now();
				consecutiveFailures = 0;
				
				if (isFrozen) {
					isFrozen = false;
					retryCount = 0;
					box.classList.remove('box-frozen');
					titleDiv.innerHTML = formatTitle(item.title);
					img.style.display = 'block';
				}

				if (img.naturalWidth && img.naturalHeight) {
					canvas.width = img.naturalWidth;
					canvas.height = img.naturalHeight;
				}
				try {
					ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
				} catch (e) {}
			};

			img.onerror = function() {
				consecutiveFailures++;
				if (consecutiveFailures >= 3 || isFrozen) {
					retryCount++;
					freezeThisCamera();
				}
			};

			function freezeThisCamera() {
				isFrozen = true;
				box.classList.add('box-frozen');
				const label = retryCount > 0 ? `[斷訊重試 ${retryCount}]` : '[斷訊]';
				titleDiv.innerHTML = `<span style='color: #d32f2f; font-size: 11px;'>${label}</span> ` + formatTitle(item.title);
				img.style.display = 'none';
			}

			function forceResetAndRefresh() {
				isFrozen = false;
				retryCount = 0;
				consecutiveFailures = 0;
				box.classList.remove('box-frozen');
				titleDiv.innerHTML = formatTitle(item.title);
				img.style.display = 'block';
				lastUpdate = Date.now();
				img.src = item.src + '&forceRefresh=' + lastUpdate;
			}

			function Refresh() {
				img.src = item.src + '&refresh=' + Date.now();
			}
			
			cameraControllers.push({
				forceReset: forceResetAndRefresh,
				refreshIfFrozen: function() {
					const isInView = box.getAttribute('data-in-view') === 'true';
					if (isFrozen && isInView) {
						Refresh();
					}
				}
			});
			
			const freezeTimer = setInterval(function() {
				const isInView = box.getAttribute('data-in-view') === 'true';
				if (isInView && !isFrozen && (Date.now() - lastUpdate > 18000)) {
					retryCount = 0;
					freezeThisCamera();
				}
			}, 6000);

			const randomOffset = Math.floor(Math.random() * 2000);
			const delayTimeout = setTimeout(() => {
				const refreshTimer = setInterval(function() {
					const isInView = box.getAttribute('data-in-view') === 'true';
					if (isInView) {
						Refresh();
					}
				}, 8000);

				activeTimers.push(freezeTimer, refreshTimer);
			}, randomOffset);
			activeTimers.push(delayTimeout);
		});
	}

	initSelectors();

	document.getElementById('globalRefreshBtn').addEventListener('click', function() {
		this.style.transform = 'rotate(360deg)';
		setTimeout(() => { this.style.transform = 'none'; }, 500);

		cameraControllers.forEach(ctrl => {
			ctrl.refreshIfFrozen();
		});

		cameraControllers.forEach(ctrl => {
			ctrl.forceReset();
		});
	});

	let resetGpsTimer = null; // 若外部仍有地方會呼叫 resetGpsTimer，可保留空函式或依需求調整
	(function() {
		const gpsBtn = document.getElementById('gpsToggleBtn');
		const mileBadge = document.getElementById('gpsMileBadge');
		let isGpsActive = false;
		let watchId = null; // 【修改點】儲存 watchPosition 的 ID
		let lastCoords = null;
		let DriverDIR = '';
		let lastGpsUpdateTime = null; // 紀錄最後更新的時間戳記
		let timerInterval = null;     // 每秒更新秒數顯示的計時器
		let wakeLock = null;

		function getDistanceKm(lat1, lon1, lat2, lon2) {
			const R = 6371;
			const dLat = (lat2 - lat1) * Math.PI / 180;
			const dLon = (lon2 - lon1) * Math.PI / 180;
			const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
					  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
					  Math.sin(dLon/2) * Math.sin(dLon/2);
			const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
			return R * c;
		}

		function updateDriverDirection(currentLat, currentLon) {
			if (!lastCoords || !cctvData || cctvData.length === 0) return;

			const dist = getDistanceKm(lastCoords.lat, lastCoords.lon, currentLat, currentLon);
			if (dist < 0.005) return;

			const currentDirItem = cctvData.find(item => item.dir);
			const baseDir = currentDirItem ? currentDirItem.dir : '';

			if (baseDir === '南' || baseDir === '北') {
				if (currentLat < lastCoords.lat) {
					DriverDIR = '南';
				} else if (currentLat > lastCoords.lat) {
					DriverDIR = '北';
				}
			} else if (baseDir === '東' || baseDir === '西') {
				if (currentLon > lastCoords.lon) {
					DriverDIR = '東';
				} else if (currentLon < lastCoords.lon) {
					DriverDIR = '西';
				}
			}

			if (DriverDIR) {
				gpsBtn.innerText = DriverDIR;
			}
		}

		function setMileBadgeText(mileNumber) {
			const roundedMile = Math.round(mileNumber * 10) / 10;
			let mileStr = '';
			
			if (Number.isInteger(roundedMile)) {
				mileStr = roundedMile.toString();
				mileBadge.classList.add('integer-style');
			} else {
				mileStr = roundedMile.toFixed(1);
				mileBadge.classList.remove('integer-style');
			}

			// 紀錄這次更新的時間與目前的里程數字
			lastGpsUpdateTime = Date.now();
			mileBadge.setAttribute('data-mile', mileStr);

			// 立即更新一次畫面
			updateSecBadge();
		}

		function updateCurrentMile(currentLat, currentLon) {
			if (!cctvData || cctvData.length === 0) return;

			const validData = cctvData.map((item, index) => ({ item, index }))
				.filter(d => d.item.lat && d.item.lon && d.item.locationMiles);

			if (validData.length === 0) return;

			let minDist = Infinity;
			let closestIdx = -1;

			validData.forEach((d, i) => {
				const dist = getDistanceKm(currentLat, currentLon, parseFloat(d.item.lat), parseFloat(d.item.lon));
				if (dist < minDist) {
					minDist = dist;
					closestIdx = i;
				}
			});

			if (closestIdx === -1) return;

			const currentPoint = validData[closestIdx];

			let prevIdx = closestIdx - 1;
			while (prevIdx >= 0) {
				const isSameDir = validData[prevIdx].item.dir === currentPoint.item.dir;
				const dist = getDistanceKm(
					parseFloat(validData[prevIdx].item.lat),
					parseFloat(validData[prevIdx].item.lon),
					parseFloat(currentPoint.item.lat),
					parseFloat(currentPoint.item.lon)
				);
				if (isSameDir && dist > 0.3) break;
				prevIdx--;
			}

			let nextIdx = closestIdx + 1;
			while (nextIdx < validData.length) {
				const isSameDir = validData[nextIdx].item.dir === currentPoint.item.dir;
				const dist = getDistanceKm(
					parseFloat(validData[nextIdx].item.lat),
					parseFloat(validData[nextIdx].item.lon),
					parseFloat(currentPoint.item.lat),
					parseFloat(currentPoint.item.lon)
				);
				if (isSameDir && dist > 0.3) break;
				nextIdx++;
			}

			if (minDist < 0.05) {
				setMileBadgeText(parseFloat(currentPoint.item.locationMiles));
				return;
			}

			if (prevIdx < 0 && nextIdx >= validData.length) {
				setMileBadgeText(parseFloat(currentPoint.item.locationMiles));
				return;
			}

			let prevPoint = prevIdx >= 0 ? validData[prevIdx] : validData[closestIdx];
			let nextPoint = nextIdx < validData.length ? validData[nextIdx] : validData[closestIdx];

			const dPrev = getDistanceKm(currentLat, currentLon, parseFloat(prevPoint.item.lat), parseFloat(prevPoint.item.lon));
			const dNext = getDistanceKm(currentLat, currentLon, parseFloat(nextPoint.item.lat), parseFloat(nextPoint.item.lon));

			const mPrev = parseFloat(prevPoint.item.locationMiles);
			const mNext = parseFloat(nextPoint.item.locationMiles);

			let calculatedMile = mPrev;
			if (dPrev + dNext > 0) {
				calculatedMile = (mPrev * dNext + mNext * dPrev) / (dPrev + dNext);
			}

			setMileBadgeText(calculatedMile);
		}

		function updateSecBadge() {
			if (!lastGpsUpdateTime) return;
			const elapsedSec = Math.floor((Date.now() - lastGpsUpdateTime) / 1000);
			
			// 取得當前的里程數字 (從內部 dataset 或變數取得)
			const currentMileText = mileBadge.getAttribute('data-mile') || '--';
			
			mileBadge.innerHTML = `${currentMileText}<span class="sec-text">（${elapsedSec} 秒前更新）</span>`;
		}

		// 處理每次位置變更的邏輯
		function handlePositionUpdate(position) {
			const currentLat = position.coords.latitude;
			const currentLon = position.coords.longitude;

			// 更新 DriverDIR 並替換按鈕文字
			updateDriverDirection(currentLat, currentLon);

			// 紀錄本次經緯度供下次比對
			lastCoords = { lat: currentLat, lon: currentLon };

			// 只有在 GPS 更新時才計算並顯示當前里程
			updateCurrentMile(currentLat, currentLon);

			let minDistance = Infinity;
			let closestIndex = -1;

			cctvData.forEach((item, idx) => {
				if (!item.lat || !item.lon) return;
				const dist = getDistanceKm(currentLat, currentLon, parseFloat(item.lat), parseFloat(item.lon));
				if (dist < minDistance) {
					minDistance = dist;
					closestIndex = idx;
				}
			});

			if (minDistance > 1) {
				let globalMinDist = Infinity;
				let bestRoad = null;
				let bestSegment = null;

				for (const roadKey in All_Data) {
					for (const segKey in All_Data[roadKey]) {
						const itemList = All_Data[roadKey][segKey];
						itemList.forEach(item => {
							if (item.lat && item.lon) {
								const d = getDistanceKm(currentLat, currentLon, parseFloat(item.lat), parseFloat(item.lon));
								if (d < globalMinDist) {
									globalMinDist = d;
									bestRoad = roadKey;
									bestSegment = segKey;
								}
							}
						});
					}
				}

				if (bestRoad && bestSegment && (bestRoad !== roadSelect.value || bestSegment !== segmentSelect.value)) {
					roadSelect.value = bestRoad;
					onRoadChange();
					segmentSelect.value = bestSegment;
					onSegmentChange();
					return;
				}
			}

			if (closestIndex === -1) return;

			const road = roadSelect.value;
			const currentSeg = segmentSelect.value;
			const segments = All_Data[road] ? Object.keys(All_Data[road]) : [];
			const segIndex = segments.indexOf(currentSeg);

			if (closestIndex <= 1 && segIndex > 0) {
				const prevSegName = segments[segIndex - 1];
				const prevSegData = All_Data[road][prevSegName] || [];
				let prevMinDist = Infinity;

				let foundCount = 0;
				for (let i = prevSegData.length - 1; i >= 0; i--) {
					const item = prevSegData[i];
					if (item.lat && item.lon) {
						const dist = getDistanceKm(currentLat, currentLon, parseFloat(item.lat), parseFloat(item.lon));
						if (dist < prevMinDist) {
							prevMinDist = dist;
						}
						foundCount++;
						if (foundCount >= 2) break;
					}
				}

				if (ScrollingTimeout === 0 && prevMinDist < minDistance) {
					const prevBtn = document.getElementById('prevSegmentBtn');
					if (prevBtn) prevBtn.click();
					return;
				}
			}

			if (closestIndex >= cctvData.length - 2 && segIndex !== -1 && segIndex < segments.length - 1) {
				const nextSegName = segments[segIndex + 1];
				const nextSegData = All_Data[road][nextSegName] || [];
				let nextMinDist = Infinity;

				let foundCount = 0;
				for (let i = 0; i < nextSegData.length; i++) {
					const item = nextSegData[i];
					if (item.lat && item.lon) {
						const dist = getDistanceKm(currentLat, currentLon, parseFloat(item.lat), parseFloat(item.lon));
						if (dist < nextMinDist) {
							nextMinDist = dist;
						}
						foundCount++;
						if (foundCount >= 2) break;
					}
				}

				if (ScrollingTimeout === 0 && nextMinDist < minDistance) {
					const nextBtn = document.getElementById('nextSegmentBtn');
					if (nextBtn) nextBtn.click();
					return;
				}
			}

			if (ScrollingTimeout === 0) {
				const targetBox = document.querySelector(`.cctv-box[data-index="${closestIndex}"]`);
				if (targetBox) {
					targetBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
				}
			}
		}
		
		// 請求螢幕不關閉
		async function requestWakeLock() {
			try {
				if ('wakeLock' in navigator) {
					wakeLock = await navigator.wakeLock.request('screen');
				}
			} catch (err) {
				console.warn(`Wake Lock 啟用失敗: ${err.name}, ${err.message}`);
			}
		}

		// 釋放螢幕鎖定（恢復預設休眠機制）
		function releaseWakeLock() {
			if (wakeLock !== null) {
				wakeLock.release().then(() => {
					wakeLock = null;
				});
			}
		}

		function startGps() {
			if (!navigator.geolocation) {
				alert('您的瀏覽器不支援 GPS 地理定位功能');
				return;
			}

			isGpsActive = true;
			gpsBtn.classList.add('active');
			DriverDIR = '';
			gpsBtn.innerText = '🧭';
			mileBadge.classList.add('show');

			// 【新增/修復點】按下 GPS 按鈕時，強制將 ScrollingTimeout 清零，確保可以立刻 Scrolling 到位置
			ScrollingTimeout = 0;

			// 開啟每秒計時器，更新秒數
			if (timerInterval) clearInterval(timerInterval);
			timerInterval = setInterval(updateSecBadge, 1000);

			// 新增：開啟 GPS 時，請求螢幕保持開啟
			requestWakeLock();

			// 【修改點】開啟 watchPosition 監聽
			watchId = navigator.geolocation.watchPosition(
				handlePositionUpdate,
				function(error) {
					// console.warn('GPS 追蹤失敗:', error.message);
				},
				{
					enableHighAccuracy: true,
					timeout: 10000,
					maximumAge: 0
				}
			);
		}

		function stopGps() {
			isGpsActive = false;
			gpsBtn.classList.remove('active');
			DriverDIR = '';
			gpsBtn.innerText = '🧭';
			mileBadge.classList.remove('show');

			// 新增：關閉 GPS 時，釋放螢幕鎖定
			releaseWakeLock();

			// 清除秒數計時器
			if (timerInterval) {
				clearInterval(timerInterval);
				timerInterval = null;
			}

			// 【修改點】停止 watchPosition 監聽
			if (watchId !== null) {
				navigator.geolocation.clearWatch(watchId);
				watchId = null;
			}
			lastCoords = null;
			lastGpsUpdateTime = null;
		}

		// 因為 watchPosition 會自動監聽 updates，不需要再手動 reset timer
		resetGpsTimer = function() {
			// 若原先其他手動操作（如切換路段）需要強制重刷，可在此重新觸發一次，或保持空實作
		};

		gpsBtn.addEventListener('click', function() {
			if (isGpsActive) {
				stopGps();
			} else {
				startGps();
			}
		});

		document.addEventListener('visibilitychange', async () => {
			if (wakeLock !== null && document.visibilityState === 'visible' && isGpsActive) {
				await requestWakeLock();
			}
		});

	})();

	(function() {
		let hideTimeout = null;
		let stopScrollTimeout = null;
		const badge = document.getElementById('scrollPercentBadge');

		function getTopVisibleTitle() {
			const boxes = document.querySelectorAll('.cctv-box');
			let topTitle = '';
			let minTopDifference = Infinity;

			boxes.forEach(box => {
				if (box.style.visibility === 'hidden') return;

				const rect = box.getBoundingClientRect();
				if (rect.bottom > 0 && rect.top < window.innerHeight) {
					const diff = Math.abs(rect.top);
					if (diff < minTopDifference) {
						minTopDifference = diff;
						const titleEl = box.querySelector('.cctv-title');
						if (titleEl) {
							topTitle = titleEl.innerText.replace(/\[斷訊.*?\]/g, '').trim();
						}
					}
				}
			});

			return topTitle;
		}

		function updateBadge() {
			const scrollTop = window.scrollY || document.documentElement.scrollTop;
			const scrollHeight = document.documentElement.scrollHeight;
			const clientHeight = document.documentElement.clientHeight;

			const totalScrollable = scrollHeight - clientHeight;
			let scrollPercent = 0;

			if (totalScrollable > 0) {
				scrollPercent = Math.round((scrollTop / totalScrollable) * 100);
			}

			const currentTitle = getTopVisibleTitle();
			const displayText = currentTitle 
				? `${currentTitle} | ${scrollPercent}%`
				: `位置：${scrollPercent}%`;

			badge.innerText = displayText;
			badge.classList.add('show');
		}

		let isTicking = false;
		window.addEventListener('scroll', function() {
			if (!isTicking) {
				window.requestAnimationFrame(() => {
					updateBadge();
					isTicking = false;
				});
				isTicking = true;
			}

			if (typeof resetGpsTimer === 'function') {
				resetGpsTimer();
			}

			if (hideTimeout !== null) clearTimeout(hideTimeout);
			if (stopScrollTimeout !== null) clearTimeout(stopScrollTimeout);

			stopScrollTimeout = setTimeout(function() {
				cameraControllers.forEach(ctrl => {
					ctrl.refreshIfFrozen();
				});
			}, 200);

			hideTimeout = setTimeout(function() {
				badge.classList.remove('show');
			}, 2500);
		});
	})();

	(function() {
		const zone = document.getElementById('rightScrollZone');
		let isInteracting = false;

		function scrollToYRatio(clientY) {
			// triggerScrollingTimeout();

			const viewportHeight = window.innerHeight;
			const clampedY = Math.max(0, Math.min(clientY, viewportHeight));
			const ratio = clampedY / viewportHeight;

			const totalScrollable = document.documentElement.scrollHeight - window.innerHeight;
			if (totalScrollable > 0) {
				const targetScrollTop = totalScrollable * ratio;
				window.scrollTo({
					top: targetScrollTop,
					behavior: 'auto'
				});
			}
		}

		zone.addEventListener('touchstart', function(e) {
			isInteracting = true;
			scrollToYRatio(e.touches[0].clientY);
		}, { passive: true });

		zone.addEventListener('touchmove', function(e) {
			if (!isInteracting) return;
			// triggerScrollingTimeout();
			scrollToYRatio(e.touches[0].clientY);
		}, { passive: true });

		zone.addEventListener('touchend', function() {
			isInteracting = false;
			// triggerScrollingTimeout();
		});

		zone.addEventListener('mousedown', function(e) {
			isInteracting = true;
			scrollToYRatio(e.clientY);
		});

		window.addEventListener('mousemove', function(e) {
			if (!isInteracting) return;
			scrollToYRatio(e.clientY);
		});

		window.addEventListener('mouseup', function() {
			if (isInteracting) {
				isInteracting = false;
				// triggerScrollingTimeout(); // 鬆開滑鼠時再次確保觸發 10 秒倒數
			}
		});
	})();

	(function() {
		const prevBtn = document.getElementById('prevSegmentBtn');
		const nextBtn = document.getElementById('nextSegmentBtn');
		let btnHideTimeout = null;

		function getValidCount(road, segment) {
			if (!All_Data[road] || !All_Data[road][segment]) return 0;
			return All_Data[road][segment].filter(item => item.title && item.title.trim() !== '').length;
		}

		function getAdjacentSegments() {
			const road = roadSelect.value;
			const currentSeg = segmentSelect.value;
			if (!road || !currentSeg || !All_Data[road]) return { prev: null, next: null };

			const segments = Object.keys(All_Data[road]);
			const currentIndex = segments.indexOf(currentSeg);

			if (currentIndex === -1) return { prev: null, next: null };

			const prevSeg = currentIndex > 0 ? segments[currentIndex - 1] : null;
			const nextSeg = currentIndex < segments.length - 1 ? segments[currentIndex + 1] : null;

			return {
				prev: prevSeg ? { name: prevSeg, count: getValidCount(road, prevSeg) } : null,
				next: nextSeg ? { name: nextSeg, count: getValidCount(road, nextSeg) } : null
			};
		}

		function updateSegmentButtons() {
			const { prev, next } = getAdjacentSegments();

			if (prev) {
				prevBtn.innerText = `⬆️ 上一區段 (${prev.count})`;
				prevBtn.dataset.targetSegment = prev.name;
				prevBtn.classList.add('show');
			} else {
				prevBtn.classList.remove('show');
			}

			if (next) {
				nextBtn.innerText = `⬇️ 下一區段 (${next.count})`;
				nextBtn.dataset.targetSegment = next.name;
				nextBtn.classList.add('show');
			} else {
				nextBtn.classList.remove('show');
			}
		}

		function hideSegmentButtons() {
			prevBtn.classList.remove('show');
			nextBtn.classList.remove('show');
		}

		window.addEventListener('scroll', function() {
			updateSegmentButtons();

			if (btnHideTimeout !== null) clearTimeout(btnHideTimeout);

			btnHideTimeout = setTimeout(function() {
				hideSegmentButtons();
			}, 2500);
		});

		prevBtn.addEventListener('click', function() {
			const targetSeg = this.dataset.targetSegment;
			if (targetSeg) {
				segmentSelect.value = targetSeg;
				onSegmentChange();

				setTimeout(() => {
					window.scrollTo({
						top: document.documentElement.scrollHeight,
						behavior: 'smooth'
					});
				}, 100);
			}
		});

		nextBtn.addEventListener('click', function() {
			const targetSeg = this.dataset.targetSegment;
			if (targetSeg) {
				segmentSelect.value = targetSeg;
				onSegmentChange();

				window.scrollTo({
					top: 0,
					behavior: 'smooth'
				});
			}
		});
	})();

	(function() {
		const fullscreenBtn = document.getElementById('fullscreenToggleBtn');
		const refreshBtn = document.getElementById('globalRefreshBtn');
		const gpsBtn = document.getElementById('gpsToggleBtn');
		let btnHideTimeout = null;

		// 檢查瀏覽器是否支援全螢幕功能及 fullscreenchange 事件
		function supportsFullscreenChange() {
			return 'onfullscreenchange' in document || 'onwebkitfullscreenchange' in document || 'msfullscreenchange' in document;
		}

		// 若不支援全螢幕，直接隱藏全螢幕按鈕
		if (!supportsFullscreenChange()) {
			fullscreenBtn.style.display = 'none';
		}

		// 判斷是否為行動裝置
		function isMobileDevice() {
			return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
		}

		// 檢查目前是否處於全螢幕狀態
		function isFullscreen() {
			return !!(
				document.fullscreenElement || 
				document.webkitFullscreenElement || 
				document.msFullscreenElement ||
				(window.navigator.standalone)
			);
		}

		// 更新全螢幕按鈕圖示與狀態
		function updateFullscreenBtnText() {
			if (isFullscreen()) {
				fullscreenBtn.innerHTML = '🗗';
			} else {
				fullscreenBtn.innerHTML = '⛶';
			}
		}

		// 統一的滾動處理函式
		function handleScroll() {
			// 1. 處理重新整理與 GPS 按鈕顯示
			refreshBtn.classList.add('show');

			// 滾動時：加上 scrolling class 讓 GPS 按鈕不透明 (opacity: 1)
			gpsBtn.classList.add('scrolling');

			// 2. 處理全螢幕按鈕顯示 (行動裝置且為全螢幕時隱藏)
			if (supportsFullscreenChange()) {
				if (isMobileDevice() && isFullscreen()) {
					fullscreenBtn.classList.remove('show');
				} else {
					updateFullscreenBtnText();
					fullscreenBtn.classList.add('show');
				}
			}

			// 3. 統一清除舊的定時器
			if (btnHideTimeout !== null) {
				clearTimeout(btnHideTimeout);
			}

			// 4. 停止滑動 2.5 秒後統一自動隱藏所有按鈕
			btnHideTimeout = setTimeout(function() {
				// 停止滾動時：移除 scrolling class，回復成透明度
				gpsBtn.classList.remove('scrolling');

				refreshBtn.classList.remove('show');
				fullscreenBtn.classList.remove('show');
			}, 2500);
			triggerScrollingTimeout();

		}

		// 點擊全螢幕按鈕切換邏輯
		fullscreenBtn.addEventListener('click', function() {
			if (!isFullscreen()) {
				const docEl = document.documentElement;
				if (docEl.requestFullscreen) {
					docEl.requestFullscreen();
				} else if (docEl.webkitRequestFullscreen) {
					docEl.webkitRequestFullscreen();
				} else if (docEl.msRequestFullscreen) {
					docEl.msRequestFullscreen();
				}
			} else {
				if (document.exitFullscreen) {
					document.exitFullscreen();
				} else if (document.webkitExitFullscreen) {
					document.webkitExitFullscreen();
				} else if (document.msExitFullscreen) {
					document.msExitFullscreen();
				}
			}
		});

		// 監聽全螢幕狀態切換事件
		document.addEventListener('fullscreenchange', updateFullscreenBtnText);
		document.addEventListener('webkitfullscreenchange', updateFullscreenBtnText);

		//  註冊唯一的滾動事件監聽
		window.addEventListener('scroll', handleScroll);
	})();


</script>

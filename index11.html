    function formatTitle(text) {
        return text.replace(/\n/g, '<br>');
    }
    const container = document.getElementById('cctvGridContainer');

    const observerOptions = {
        root: null,
        threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const box = entry.target;
            box.setAttribute('data-in-view', entry.isIntersecting);
        });
    }, observerOptions);

    const cameraControllers = [];

    cctvData.forEach((item, index) => {
        const box = document.createElement('div');
        box.className = 'cctv-box';
		box.setAttribute('data-index', index);
		
		if (!item.title && !item.src) {
			box.style.visibility = 'hidden';
			container.appendChild(box);
			return;
		}
		
        box.setAttribute('data-in-view', 'false');

        const titleDiv = document.createElement('div');
        titleDiv.className = 'cctv-title';
        titleDiv.innerHTML = formatTitle(item.title);

        titleDiv.addEventListener('click', function() {
            window.open(item.link, '_blank');
        });
		
        const wrapper = document.createElement('div');
        wrapper.className = 'video-wrapper';

        const img = document.createElement('img');
        img.className = 'cctv-img';
        img.src = item.src;

        const canvas = document.createElement('canvas');
        canvas.className = 'cctv-canvas';
        const ctx = canvas.getContext('2d');

        wrapper.appendChild(img);
        wrapper.appendChild(canvas);
        box.appendChild(titleDiv);
        box.appendChild(wrapper);
        container.appendChild(box);

        observer.observe(box);

        let lastUpdate = Date.now();
        let isFrozen = false;
		let retryCount = 0;

        img.onload = function() {
            if (isFrozen) return;
            lastUpdate = Date.now();
            
			if (img.naturalWidth && img.naturalHeight) {
				canvas.width = img.naturalWidth;
				canvas.height = img.naturalHeight;
			}
            try {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            } catch (e) {}
        };

        img.onerror = function() {
            freezeThisCamera();
        };

        function freezeThisCamera() {
            if (isFrozen) return;
            isFrozen = true;
            box.classList.add('box-frozen');
            titleDiv.innerHTML = "<span style='color: #d32f2f; font-size: 11px;'>[斷訊]</span> " + formatTitle(item.title);
            img.style.display = 'none';
        }

        let ReconnectRequest = false;
		
        function forceResetAndRefresh() {
            isFrozen = false;
			retryCount = 0;
			ReconnectRequest = false;
            box.classList.remove('box-frozen');
            titleDiv.innerHTML = formatTitle(item.title);
            img.style.display = 'block';
            lastUpdate = Date.now();
            img.src = item.src + '&forceRefresh=' + lastUpdate;
        }

        function Refresh() {
			if (ReconnectRequest) return;
			ReconnectRequest = true;
			const testImg = new Image();

			const timer = setTimeout(() => {
				testImg.src = "";
				ReconnectRequest = false;
			}, 5000);

			testImg.onload = function() {
				clearTimeout(timer);
				if (testImg.naturalWidth > 0 && testImg.naturalHeight > 0) {
					isFrozen = false;
					retryCount = 0;
					box.classList.remove('box-frozen');
					titleDiv.innerHTML = formatTitle(item.title);
					img.style.display = 'block';
					img.src = item.src + '&refresh=' + new Date().getTime();
					lastUpdate = Date.now();
				}
				ReconnectRequest = false;
			};
			testImg.onerror = function() {
				clearTimeout(timer);
				retryCount++;
				titleDiv.innerHTML = `<span style='color: #d32f2f; font-size: 11px;'>[斷訊重試 ${retryCount}]</span> ` + formatTitle(item.title);
				ReconnectRequest = false;
			};
			testImg.src = item.src + '&test=' + new Date().getTime();
		}
		
		cameraControllers.push({
			forceReset: forceResetAndRefresh,
			refreshIfFrozen: function() {
				const isInView = box.getAttribute('data-in-view') === 'true';
				if (isFrozen && isInView) {
					Refresh();
				}
			}
		});
		
        setInterval(function() {
            if (!isFrozen && (Date.now() - lastUpdate > 10000)) {
                retryCount = 0;
				freezeThisCamera();
            }
        }, 6000);

        setInterval(function() {
            const isInView = box.getAttribute('data-in-view') === 'true';
            if (isInView) {
				Refresh();
            }
        }, 8000);
    });

	document.getElementById('globalRefreshBtn').addEventListener('click', function() {
		this.style.transform = 'rotate(360deg)';
		setTimeout(() => { this.style.transform = 'none'; }, 500);

		cameraControllers.forEach(ctrl => {
			ctrl.refreshIfFrozen();
		});

		cameraControllers.forEach(ctrl => {
			ctrl.forceReset();
		});
	});

    // ? ----------------- GPS 浮動開關與定位邏輯 -----------------
    let resetGpsTimer = null;
    (function() {
        const gpsBtn = document.getElementById('gpsToggleBtn');
        let isGpsActive = false;
        let gpsTimer = null;
        let lastCoords = null;

        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const y = Math.sin(deltaLambda) * Math.cos(phi2);
            const x = Math.cos(phi1) * Math.sin(phi2) -
                      Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        function updateArrowIcon(lat1, lon1, lat2, lon2) {
            const dist = getDistanceKm(lat1, lon1, lat2, lon2);
            if (dist < 0.005) {
                gpsBtn.innerText = '?';
                return;
            }

            const bearing = getBearing(lat1, lon1, lat2, lon2);
            if (bearing >= 45 && bearing < 135) {
                gpsBtn.innerText = '➡️';
            } else if (bearing >= 135 && bearing < 225) {
                gpsBtn.innerText = '⬇️';
            } else if (bearing >= 225 && bearing < 315) {
                gpsBtn.innerText = '⬅️';
            } else {
                gpsBtn.innerText = '⬆️';
            }
        }

        function trackAndScroll() {
            if (!navigator.geolocation) {
                alert('您的瀏覽器不支援 GPS 地理定位功能');
                stopGps();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const currentLat = position.coords.latitude;
                    const currentLon = position.coords.longitude;

                    if (lastCoords) {
                        updateArrowIcon(lastCoords.lat, lastCoords.lon, currentLat, currentLon);
                    }
                    lastCoords = { lat: currentLat, lon: currentLon };

                    let minDistance = Infinity;
                    let closestIndex = -1;

                    cctvData.forEach((item, idx) => {
                        if (!item.lat || !item.lon) return;
                        const dist = getDistanceKm(currentLat, currentLon, parseFloat(item.lat), parseFloat(item.lon));
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestIndex = idx;
                        }
                    });

                    if (closestIndex !== -1) {
                        const targetBox = document.querySelector(`.cctv-box[data-index="${closestIndex}"]`);
                        if (targetBox) {
                            targetBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                },
                function(error) {
                    console.warn('GPS 取得失敗:', error.message);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 2500,
                    maximumAge: 0
                }
            );
        }

        function startGps() {
            isGpsActive = true;
            gpsBtn.classList.add('active');
            gpsBtn.innerText = '?';
            trackAndScroll();
            gpsTimer = setInterval(trackAndScroll, 10000);
        }

        function stopGps() {
            isGpsActive = false;
            gpsBtn.classList.remove('active');
            gpsBtn.innerText = '?';
            if (gpsTimer) {
                clearInterval(gpsTimer);
                gpsTimer = null;
            }
            lastCoords = null;
        }

        resetGpsTimer = function() {
            if (!isGpsActive) return;
            if (gpsTimer) {
                clearInterval(gpsTimer);
            }
            gpsTimer = setInterval(trackAndScroll, 10000);
        };

        gpsBtn.addEventListener('click', function() {
            if (isGpsActive) {
                stopGps();
            } else {
                startGps();
            }
        });
    })();

	(function() {
		let hideTimeout = null;
		let stopScrollTimeout = null;
		const badge = document.getElementById('scrollPercentBadge');

		function getTopVisibleTitle() {
			const boxes = document.querySelectorAll('.cctv-box');
			let topTitle = '';
			let minTopDifference = Infinity;

			boxes.forEach(box => {
				if (box.style.visibility === 'hidden') return;

				const rect = box.getBoundingClientRect();
				if (rect.bottom > 0 && rect.top < window.innerHeight) {
					const diff = Math.abs(rect.top);
					if (diff < minTopDifference) {
						minTopDifference = diff;
						const titleEl = box.querySelector('.cctv-title');
						if (titleEl) {
							// topTitle = titleEl.innerText.replace(/\[斷訊.*?\]/g, '').replace(/\n/g, ' ').trim();
							topTitle = titleEl.innerText.replace(/\[斷訊.*?\]/g, '').trim();
						}
					}
				}
			});

			return topTitle;
		}

		function updateBadge() {
			const scrollTop = window.scrollY || document.documentElement.scrollTop;
			const scrollHeight = document.documentElement.scrollHeight;
			const clientHeight = document.documentElement.clientHeight;

			const totalScrollable = scrollHeight - clientHeight;
			let scrollPercent = 0;

			if (totalScrollable > 0) {
				scrollPercent = Math.round((scrollTop / totalScrollable) * 100);
			}

			const currentTitle = getTopVisibleTitle();
			const displayText = currentTitle 
				? `${currentTitle} | ${scrollPercent}%`
				: `位置：${scrollPercent}%`;

			badge.innerText = displayText;
			badge.classList.add('show');
		}

		window.addEventListener('scroll', function() {
			updateBadge();

			// 當發生 scroll 事件時，若 GPS 定位正在執行，則重新開始計時
			if (typeof resetGpsTimer === 'function') {
				resetGpsTimer();
			}

			if (hideTimeout !== null) clearTimeout(hideTimeout);
			if (stopScrollTimeout !== null) clearTimeout(stopScrollTimeout);

			stopScrollTimeout = setTimeout(function() {
				cameraControllers.forEach(ctrl => {
					ctrl.refreshIfFrozen();
				});
			}, 200);

			hideTimeout = setTimeout(function() {
				badge.classList.remove('show');
			}, 2500);
		});
	})();

    (function() {
        const zone = document.getElementById('rightScrollZone');
        let isInteracting = false;

        function scrollToYRatio(clientY) {
            const viewportHeight = window.innerHeight;
            const clampedY = Math.max(0, Math.min(clientY, viewportHeight));
            const ratio = clampedY / viewportHeight;

            const totalScrollable = document.documentElement.scrollHeight - window.innerHeight;
            if (totalScrollable > 0) {
                const targetScrollTop = totalScrollable * ratio;
                window.scrollTo({
                    top: targetScrollTop,
                    behavior: 'auto'
                });
            }
        }

        zone.addEventListener('touchstart', function(e) {
            isInteracting = true;
            scrollToYRatio(e.touches[0].clientY);
        }, { passive: true });

        zone.addEventListener('touchmove', function(e) {
            if (!isInteracting) return;
            scrollToYRatio(e.touches[0].clientY);
        }, { passive: true });

        zone.addEventListener('touchend', function() {
            isInteracting = false;
        });

        zone.addEventListener('mousedown', function(e) {
            isInteracting = true;
            scrollToYRatio(e.clientY);
        });

        window.addEventListener('mousemove', function(e) {
            if (!isInteracting) return;
            scrollToYRatio(e.clientY);
        });

        window.addEventListener('mouseup', function() {
            isInteracting = false;
        });
    })();
</script>

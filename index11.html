            display: block;
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .box-frozen {

        .floating-refresh-btn {

            top: 10px;       /* 距離頂部 20px */
            right: 10px;     /* 距離右側 20px */

            height: 40px;

            justify-content: center;
            align-items: center;

		{ title: "90K+470 北\n竹北-湖口服務區", src: "https://cctvn.freeway.gov.tw/abs2mjpg/bmjpg?camera=19040", link: "https://www.twipcam.com/cam/n1-n-90k-470" },

    function formatTitle(text) {
        return text.replace(/\n/g, '<br>');
    }
    const container = document.getElementById('cctvGridContainer');

    // ? 建立交叉觀察器監聽配置
    const observerOptions = {
        root: null, // null 代表以瀏覽器視窗（viewport）為觀察範圍
        threshold: 0.1 // 卡片只要露出 10% 以上就視為進入顯示範圍
    };

    // ? 定義觀察器的行為
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const box = entry.target;
            // 透過自訂屬性，動態標記這張卡片目前是不是在螢幕範圍內 (true / false)
            box.setAttribute('data-in-view', entry.isIntersecting);
        });
    }, observerOptions);

    // 用來存放所有攝影機控制函式的陣列，方便點擊全局刷新按鈕時統一調用
    const cameraControllers = [];

    cctvData.forEach((item, index) => {
        const box = document.createElement('div');
        box.className = 'cctv-box';
		
		// ? 處理資料為空的情況：若無 title 與 src，直接生成空白卡片並跳過後續攝影機邏輯
		if (!item.title && !item.src) {
			box.style.visibility = 'hidden'; // 隱藏內容但保留空間 (亦可改用 opacity: 0)
			// 若希望完全不佔據背景邊框，可以取消邊框與背景：
			// box.style.border = 'none';
			// box.style.background = 'transparent';
			// box.style.boxShadow = 'none';
			
			container.appendChild(box);
			return; // 結束本次迴圈，不執行監聽與圖片載入
		}
		
        box.setAttribute('data-in-view', 'false');

        const titleDiv = document.createElement('div');
        titleDiv.className = 'cctv-title';
        titleDiv.innerHTML = formatTitle(item.title); // ? 套用 \n 轉換

        titleDiv.addEventListener('click', function() {
            window.open(item.link, '_blank');
        });
		
        const wrapper = document.createElement('div');
        wrapper.className = 'video-wrapper';

        // 1. 建立真實的 img 標籤 (負責正常播放，避開 CORS 問題)
        const img = document.createElement('img');
        img.className = 'cctv-img';
        img.src = item.src;

        // 2. 建立待命的 Canvas (負責斷電凍結畫面)
        const canvas = document.createElement('canvas');
        canvas.className = 'cctv-canvas';
        const ctx = canvas.getContext('2d');

        wrapper.appendChild(img);
        wrapper.appendChild(canvas);
        box.appendChild(titleDiv);
        box.appendChild(wrapper);
        container.appendChild(box);

        // ? 讓觀察器開始追蹤這個卡片元素
        observer.observe(box);

        let lastUpdate = Date.now();
        let isFrozen = false;
		let retryCount = 0; // ? 每個卡片各自獨立的重試計數器

        // ? 解決核心：活體監測機制。MJPEG 串流正常運作時，會源源不絕地觸發 onload
        img.onload = function() {
            if (isFrozen) return;
            lastUpdate = Date.now(); // 刷新最後收到的影格時間
            
			if (img.naturalWidth && img.naturalHeight) {
				canvas.width = img.naturalWidth;
				canvas.height = img.naturalHeight;
			}
            // 嘗試在背景把當前影格記錄到 Canvas 當作備份副本
            try {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                // 由於跨域限制，drawImage 會在控制台跳錯誤，但「最後畫面依然會成功留在畫布上」
                // 這是利用瀏覽器渲染引擎的特性，即使 tainted canvas 無法導出(toDataURL)，但繪製畫面上仍有效
            }
        };

        // ? 如果網路直接報錯 (例如 404/502)
        img.onerror = function() {
            freezeThisCamera();
        };

        function freezeThisCamera() {
            if (isFrozen) return;
            isFrozen = true;
            box.classList.add('box-frozen');
			
            // ? 斷訊時，保留原本用 \n 分開的兩行，並在右側或尾端補上紅色狀態字樣
            titleDiv.innerHTML = "<span style='color: #d32f2f; font-size: 11px;'>[斷訊]</span> " + formatTitle(item.title);
            img.style.display = 'none'; // 隱藏變成黑畫面的 img，讓地下的 Canvas 最後畫面露出來
        }

        // ? 提供一個公開的刷新管道給外部按鈕呼叫
        function forceResetAndRefresh() {
            isFrozen = false;
			retryCount = 0; // 手動刷新時重置計數
            box.classList.remove('box-frozen');
            titleDiv.innerHTML = formatTitle(item.title);
            img.style.display = 'block';
            // 強制加上最新時間戳，使瀏覽器清空緩存，向高公局發送全新連線
            img.src = item.src + '&forceRefresh=' + new Date().getTime();
            lastUpdate = Date.now();
        }

        let ReconnectRequest = false;
		
        function Refresh() {
			if ( !ReconnectRequest ) {
				ReconnectRequest = true;
				const testImg = new Image();
				testImg.onload = function() {
					// 只有真實拿到影像才解除斷訊
					if (testImg.naturalWidth > 0 && testImg.naturalHeight > 0) {
						isFrozen = false;
						retryCount = 0; // 成功連線，歸零計數
						box.classList.remove('box-frozen');
						titleDiv.innerHTML = formatTitle(item.title); // 恢復原標題
						img.style.display = 'block';
						img.src = item.src + '&refresh=' + new Date().getTime();
						lastUpdate = Date.now();
					}
				};
				// 測試失敗時，僅累加此攝影機自己的 retryCount
				testImg.onerror = function() {
					retryCount++;
					titleDiv.innerHTML = `<span style='color: #d32f2f; font-size: 11px;'>[斷訊重試 ${retryCount}]</span> ` + formatTitle(item.title);
				};
				testImg.src = item.src + '&test=' + new Date().getTime();
				ReconnectRequest = false;
			}
		}
		
        // 將此格子的重置控制權丟到全域陣列中
		cameraControllers.push({
			forceReset: forceResetAndRefresh,
			refreshIfFrozen: function() {
				const isInView = box.getAttribute('data-in-view') === 'true';
				if (isFrozen && isInView) {
					Refresh();
				}
			}
		});
		
        // ? 監控看守狗 (Watchdog)：高公局斷流時常常「不報錯」，而是畫面直接卡死。
        // 我們每 6 秒檢查一次，如果該格子超過 10 秒都沒有收到新的資料(onload 沒觸發)，就判定為斷訊。
        setInterval(function() {
            if (!isFrozen && (Date.now() - lastUpdate > 10000)) {
                retryCount = 0; // 初次斷訊時重置計數
				freezeThisCamera();
            }
        }, 6000);

        // ? 背景每 8 秒默默重連機制
        setInterval(function() {
            // 同時滿足兩個條件：1. 必須是斷訊狀態 (isFrozen) 2. 必須在目前的視窗範圍內 (data-in-view === 'true')
            const isInView = box.getAttribute('data-in-view') === 'true';
            
            if (isInView) {
				Refresh();
            }
        }, 8000);
    });

	// ? 2. 右上角浮動按鈕：點擊時強制刷新全站，並立即優先重連當前畫面中的斷訊影像
	document.getElementById('globalRefreshBtn').addEventListener('click', function() {
		// 按鈕旋轉特效
		this.style.transform = 'rotate(360deg)';
		setTimeout(() => { this.style.transform = 'none'; }, 500);

		// 1. 先對目前畫面上「已斷訊」的攝影機發起立即重連測試
		cameraControllers.forEach(ctrl => {
			ctrl.refreshIfFrozen();
		});

		// 2. 執行全域強制重置（刷新所有攝影機串流）
		cameraControllers.forEach(ctrl => {
			ctrl.forceReset();
		});
	});
	
// ? 當滑動停止時，更新左上角浮動視窗顯示頁面百分比與當前影片 Title
	(function() {
		let scrollTimeout = null;
		let hideTimeout = null;
		const badge = document.getElementById('scrollPercentBadge');

		// 取得目前視窗範圍內最靠近頂部的影片標題
		function getTopVisibleTitle() {
			const boxes = document.querySelectorAll('.cctv-box');
			let topTitle = '';
			let minTopDifference = Infinity;

			boxes.forEach(box => {
				// 確保該卡片有內容且非隱藏
				if (box.style.visibility === 'hidden') return;

				const rect = box.getBoundingClientRect();
				// 判斷卡片是否在可視區塊內（底部在視窗頂部以下，且頂部在視窗底部以上）
				if (rect.bottom > 0 && rect.top < window.innerHeight) {
					// 尋找距離頂部（0px）最近的卡片
					const diff = Math.abs(rect.top);
					if (diff < minTopDifference) {
						minTopDifference = diff;
						const titleEl = box.querySelector('.cctv-title');
						if (titleEl) {
							// 提取標題文字並移除換行符號（將換行替換為空格）
							topTitle = titleEl.innerText.replace(/\[斷訊.*?\]/g, '').replace(/\n/g, ' ').trim();
						}
					}
				}
			});

			return topTitle;
		}

		window.addEventListener('scroll', function() {
			// 滑動過程中隱藏或準備更新
			if (scrollTimeout !== null) {
				clearTimeout(scrollTimeout);
			}
			if (hideTimeout !== null) {
				clearTimeout(hideTimeout);
			}

			// 停止滑動 200 毫秒後計算百分比與當前影片標題並顯示浮動視窗
			scrollTimeout = setTimeout(function() {
				const scrollTop = window.scrollY || document.documentElement.scrollTop;
				const scrollHeight = document.documentElement.scrollHeight;
				const clientHeight = document.documentElement.clientHeight;

				const totalScrollable = scrollHeight - clientHeight;
				let scrollPercent = 0;

				if (totalScrollable > 0) {
					scrollPercent = Math.round((scrollTop / totalScrollable) * 100);
				}

				const currentTitle = getTopVisibleTitle();
				// 組合成文字：位置 % + 當前標題（若有標題則補上分隔線）
				const displayText = currentTitle 
					? `${currentTitle} | ${scrollPercent}%`
					: `位置：${scrollPercent}%`;

				// 更新內容並顯示
				badge.innerText = displayText;
				badge.classList.add('show');

				// ? 2. 核心新增：當滾輪停止時，對目前可視視窗內「已斷訊」的圖像觸發重連機制
				cameraControllers.forEach(ctrl => {
					ctrl.refreshIfFrozen();
				});

				// 顯示 2.5 秒後自動淡出隱藏
				hideTimeout = setTimeout(function() {
					badge.classList.remove('show');
				}, 2500);

			}, 200); // 200 毫秒無滑動動作判定為停止
		});
	})();
</script>

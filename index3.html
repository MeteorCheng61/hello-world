<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速公路即時影像監控系統</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 100%;
            margin: 0 auto 12px auto;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
            white-space: nowrap;
        }

        select {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 網格佈局：預設每行 2 個畫面；在單欄/小螢幕時也能 100% 填滿 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            flex: 1;
            align-content: start;
        }

        /* 針對小螢幕或僅 1 個影像時自動縮成一行 1 個並維持 100% 寬度 */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }

        .cam-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
            width: 100%; /* 強制 100% 寬度 */
        }

        /* 斷訊時卡片邊框變亮紅 */
        .cam-card.is-offline {
            border-color: var(--danger-color);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000000;
        }

        .video-container img.source-img {
            display: none;
        }

        .video-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        /* 斷訊時：僅調暗 10% (亮度為 90%) */
        .video-container canvas.offline {
            filter: brightness(0.9);
        }

        .cam-info {
            padding: 8px 12px;
            background-color: var(--card-bg);
        }

        .cam-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background-color: var(--accent-color);
            color: #000000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        /* 斷訊時，下方文字標籤顯示紅底白字「斷訊」 */
        .badge.badge-offline {
            background-color: var(--danger-color);
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        .cam-detail {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.3;
        }

        /* 浮動按鈕 */
        .float-btn {
            position: fixed;
            z-index: 999;
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.85rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            display: none;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .float-btn:hover {
            transform: translateY(-3px);
            background-color: #7dd3fc;
        }

        #btnPrev { top: 15px; right: 20px; }
        #btnNext { bottom: 15px; right: 20px; }
    </style>
</head>

        function initRoadSelect() {
            Object.keys(cctvData).forEach(roadKey => {
                const opt = document.createElement('option');
                opt.value = roadKey;
                opt.textContent = roadKey;
                selectRoad.appendChild(opt);
            });
            initIntersectionObserver();
            initAutoRefreshLoop();
        }

        // 初始化可視區域監控器 (IntersectionObserver)
        function initIntersectionObserver() {
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        visibleCards.add(entry.target);
                    } else {
                        visibleCards.delete(entry.target);
                    }
                });
            }, {
                root: null,
                threshold: 0.1 // 只要顯示 10% 即算進入可視範圍
            });
        }

        // 定時 1 秒檢查一次可視區域內的卡片狀態
        function initAutoRefreshLoop() {
            if (autoCheckInterval) clearInterval(autoCheckInterval);
            
            autoCheckInterval = setInterval(() => {
                visibleCards.forEach(card => {
                    if (card.dataset.isOffline === "true") {
                        const imgId = card.dataset.imgId;
                        const img = document.getElementById(imgId);
                        if (img && card.refreshStream) {
                            card.refreshStream();
                        }
                    }
                });
            }, 1000); // 1 秒
        }

        selectRoad.addEventListener('change', function() {
            const selectedRoad = this.value;
            selectRange.innerHTML = '<option value="">-- 請選擇區間 --</option>';
            clearAllVideos();

            if (!selectedRoad || !cctvData[selectedRoad]) {
                selectRange.disabled = true;
                updateFloatButtons();
                return;
            }

            const rangesObj = cctvData[selectedRoad];
            Object.keys(rangesObj).forEach(rangeKey => {
                const camMap = rangesObj[rangeKey];
                const count = Object.keys(camMap).length;

                const opt = document.createElement('option');
                opt.value = rangeKey;
                opt.textContent = `${rangeKey} (含 ${count} 支攝影機)`;
                selectRange.appendChild(opt);
            });

            selectRange.disabled = false;
            updateFloatButtons();
        });

        selectRange.addEventListener('change', function() {
            const selectedRoad = selectRoad.value;
            const selectedRange = this.value;

            clearAllVideos();

            if (!selectedRoad || !selectedRange) {
                updateFloatButtons();
                return;
            }

            const camMap = cctvData[selectedRoad][selectedRange];
            if (camMap) {
                renderVideos(Object.values(camMap));
            }

            updateFloatButtons();
        });

        function clearAllVideos() {
            activeTimers.forEach(id => {
                cancelAnimationFrame(id);
                clearInterval(id);
            });
            activeTimers = [];
            if (observer) {
                observer.disconnect();
            }
            visibleCards.clear();
            videoGrid.innerHTML = '';
        }

        function updateFloatButtons() {
            const idx = selectRange.selectedIndex;
            const total = selectRange.options.length;

            if (idx <= 0) {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
                return;
            }

            if (idx > 1) {
                const prevText = selectRange.options[idx - 1].value;
                btnPrev.innerHTML = `▲ 上一區間 (${prevText})`;
                btnPrev.style.display = 'flex';
            } else {
                btnPrev.style.display = 'none';
            }

            if (idx < total - 1) {
                const nextText = selectRange.options[idx + 1].value;
                btnNext.innerHTML = `▼ 下一區間 (${nextText})`;
                btnNext.style.display = 'flex';
            } else {
                btnNext.style.display = 'none';
            }
        }

        btnPrev.addEventListener('click', function() {
            if (selectRange.selectedIndex > 1) {
                selectRange.selectedIndex -= 1;
                selectRange.dispatchEvent(new Event('change'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        btnNext.addEventListener('click', function() {
            if (selectRange.selectedIndex < selectRange.options.length - 1) {
                selectRange.selectedIndex += 1;
                selectRange.dispatchEvent(new Event('change'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        function renderVideos(cams) {
            // 如果該區間只有 1 個影像，調整 Grid 寬度自動填滿 100%
            if (cams.length === 1) {
                videoGrid.style.gridTemplateColumns = '1fr';
            } else {
                videoGrid.style.gridTemplateColumns = '';
            }

            cams.forEach((cam, index) => {
                const card = document.createElement('div');
                card.className = 'cam-card';
                card.id = `cam-card-${index}`;

                const canvasId = `cam-canvas-${index}`;
                const imgId = `cam-img-${index}`;
                const badgeId = `cam-badge-${index}`;

                card.dataset.imgId = imgId;
                card.dataset.isOffline = "false";
                card.dataset.baseUrl = cam.VideoStreamURL;
                card.dataset.direction = cam.RoadDirection || '即時';

                const imgUrl = `${cam.VideoStreamURL}&t=${new Date().getTime()}`;

                card.innerHTML = `
                    <div class="video-container">
                        <img id="${imgId}" class="source-img" src="${imgUrl}" alt="${cam.location}">
                        <canvas id="${canvasId}"></canvas>
                    </div>
                    <div class="cam-info">
                        <div class="cam-title">
                            <span>${cam.location || cam.CCTVID}</span>
                            <span id="${badgeId}" class="badge">${cam.RoadDirection || '即時'}</span>
                        </div>
                        <div class="cam-detail">
                            <strong>CCTVID:</strong> ${cam.CCTVID}<br>
                            <strong>道路 / 路段:</strong> ${(cam.RoadName || '') + ' ' + (cam.RoadSection || '')}
                        </div>
                    </div>
                `;

                videoGrid.appendChild(card);
                // 註冊 IntersectionObserver 觀察卡片
                if (observer) {
                    observer.observe(card);
                }

                startStreamCanvasMirror(imgId, canvasId, badgeId, card);
            });
        }

        function startStreamCanvasMirror(imgId, canvasId, badgeId, card) {
            const img = document.getElementById(imgId);
            const canvas = document.getElementById(canvasId);
            const badge = document.getElementById(badgeId);
            if (!img || !canvas || !badge) return;

            const ctx = canvas.getContext('2d');
            let animTimer = null;
            let checkTimer = null;
            let isBroken = false;
            let lastUpdate = Date.now();

            function triggerOffline() {
                if (isBroken) return;
                isBroken = true;

                if (animTimer) cancelAnimationFrame(animTimer);
                if (checkTimer) clearInterval(checkTimer);

                // 畫面僅調暗 10%
                canvas.classList.add('offline');

                // 下方文字標籤替換為「斷訊」
                badge.textContent = '斷訊';
                badge.classList.add('badge-offline');

                if (card) {
                    card.classList.add('is-offline');
                    card.dataset.isOffline = "true";
                }
            }

            function drawFrame() {
                if (isBroken) return;

                if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                    if (canvas.width !== img.naturalWidth) {
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                    }
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    lastUpdate = Date.now();
                }

                animTimer = requestAnimationFrame(drawFrame);
                activeTimers.push(animTimer);
            }

            // 重新整理影像串流的函式
            card.refreshStream = function() {
                isBroken = false;
                card.dataset.isOffline = "false";
                card.classList.remove('is-offline');
                canvas.classList.remove('offline');
                badge.textContent = card.dataset.direction;
                badge.classList.remove('badge-offline');

                lastUpdate = Date.now();
                // 加上時間戳記以更新流量與繞過快取
                img.src = `${card.dataset.baseUrl}&t=${new Date().getTime()}`;

                drawFrame();

                if (checkTimer) clearInterval(checkTimer);
                checkTimer = setInterval(() => {
                    if (Date.now() - lastUpdate > 1500) {
                        triggerOffline();
                    }
                }, 500);
                activeTimers.push(checkTimer);
            };

            drawFrame();

            img.onerror = function() {
                triggerOffline();
            };

            checkTimer = setInterval(() => {
                if (Date.now() - lastUpdate > 1500) {
                    triggerOffline();
                }
            }, 500);
            activeTimers.push(checkTimer);
        }

        initRoadSelect();
    </script>
</body>
</html>

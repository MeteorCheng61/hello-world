<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>用戶管理系統</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .tabs { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .tabs button { flex: 1; padding: 8px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; }
    .tabs button.active { background: #007bff; color: white; border-color: #007bff; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button.submit-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
    #message { margin-top: 15px; padding: 10px; text-align: center; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>用戶管理系統</h2>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">登入</button>
    <button class="tab-btn" onclick="switchTab('register')">註冊</button>
    <button class="tab-btn" onclick="switchTab('forgot')">忘記密碼</button>
    <button class="tab-btn" onclick="switchTab('delete')">刪除帳戶</button>
  </div>

  <form id="userForm">
    <div class="form-group" id="field-username">
      <label>帳號 (Username)</label>
      <input type="text" id="username" required>
    </div>

    <div class="form-group" id="field-password">
      <label>密碼 (Password)</label>
      <input type="password" id="password">
    </div>

    <div class="form-group" id="field-email" style="display:none;">
      <label>電子郵件 (E-mail)</label>
      <input type="email" id="email">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">登入</button>
  </form>

  <div id="message"></div>

  <script>
    let currentAction = 'login';

    function switchTab(action) {
      currentAction = action;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const fieldPassword = document.getElementById('field-password');
      const fieldEmail = document.getElementById('field-email');
      const submitBtn = document.getElementById('submitBtn');

      // 重置欄位顯示
      fieldPassword.style.display = 'block';
      fieldEmail.style.display = 'none';

      if (action === 'login') {
        submitBtn.innerText = '登入';
      } else if (action === 'register') {
        fieldEmail.style.display = 'block';
        submitBtn.innerText = '註冊帳戶';
      } else if (action === 'forgot') {
        fieldPassword.style.display = 'none';
        fieldEmail.style.display = 'block';
        submitBtn.innerText = '查詢密碼';
      } else if (action === 'delete') {
        submitBtn.innerText = '確認刪除帳戶';
      }
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        action: currentAction,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        email: document.getElementById('email').value
      };

      const msgDiv = document.getElementById('message');
      msgDiv.style.display = 'block';
      msgDiv.className = '';
      msgDiv.innerText = '處理中...';

      try {
        const res = await fetch('/.netlify/functions/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          msgDiv.className = 'success';
          msgDiv.innerText = data.message;
        } else {
          msgDiv.className = 'error';
          msgDiv.innerText = data.message || '操作失敗';
        }
      } catch (err) {
        msgDiv.className = 'error';
        msgDiv.innerText = '連線失敗，請稍後再試';
      }
    });
  </script>
</body>
</html>
